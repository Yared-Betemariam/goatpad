[package]
name = "goatpad"
version = "1.5.0"
edition = "2024"

[dependencies]
directories = "6.0.0"
eframe = "0.36.1"
egui = "0.36.1"
egui-phosphor = "0.13.0"
pulldown-cmark = "0.13.0"
rfd = "0.15.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.25.0", features = ["v4", "serde"] }
semver = "1.0.27"
sha2 = "0.10.9"
ureq = "3.1.4"
egui_extras = "0.36.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Registry"] }
windows = { version = "0.62.2", features = [
    "Win32_Globalization",
    "Win32_System_Com",
    "Win32_Foundation",
] }

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
winres = "0.1.12"
